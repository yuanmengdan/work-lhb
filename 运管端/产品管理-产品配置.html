  function sanitizeDisplayHtml(raw){
    const wrap=document.createElement('div');wrap.innerHTML=String(raw||'');const output=document.createElement('div');
    const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','UL','OL','LI','H2','H3','H4','BLOCKQUOTE']);
    function walk(src,dst){for(const n of Array.from(src.childNodes)){
      if(n.nodeType===3){dst.appendChild(document.createTextNode(n.textContent));continue}
      if(n.nodeType!==1)continue;
      const tag=n.tagName;
      if(['SCRIPT','STYLE','IFRAME','SVG','OBJECT','VIDEO','AUDIO','FORM'].includes(tag))continue;
      if(tag==='IMG'){
        const id=n.getAttribute('data-display-rich-id')||'';
        if(/^display-rimg-[\w-]+$/.test(id)){const img=document.createElement('img');img.setAttribute('data-display-rich-id',id);img.setAttribute('alt',(n.getAttribute('alt')||'图文图片').slice(0,80));dst.appendChild(img)}
        continue;
      }
      if(allowed.has(tag)){const el=document.createElement(tag.toLowerCase());dst.appendChild(el);walk(n,el)}else walk(n,dst);
    }}
    walk(wrap,output);return output.innerHTML;
  }

  function displayAgeErrors(){
    const a=state.displayDraft.age;const err={min:'',max:''};const hasMin=a.min!=='';const hasMax=a.max!=='';
    // 年龄整体选填；若填写了最大年龄，最小年龄必须填写；仅填写最小年龄代表无上限。
    if(!hasMin&&!hasMax)return err;
    if(!/^\d+$/.test(a.min))err.min='请填写最小年龄';
    if(hasMax&&!/^\d+$/.test(a.max))err.max='请输入有效的最大年龄';
    if(!err.min&&!err.max&&hasMax){
      const min=Number(a.min),max=Number(a.max);
      const valid=a.unit==='year'?min<=max:min<(max+1)*365.2425;
      if(!valid)err.max='最大年龄不能小于最小年龄';
    }
    return err;
  }

  $('#config-main').addEventListener('drop',e=>{if(!displayCoreDrag)return;e.preventDefault();const from=displayCoreDrag,to=e.target.closest('.display-core-row')?.dataset.displayCoreRow||displayCoreTarget,after=displayCoreAfter;displayCoreDragClear();displayMoveCore(from,to,after)});
  $('#config-main').addEventListener('dragend',()=>displayCoreDragClear());
  window.addEventListener('beforeunload',e=>{if(isDirty()||isRatesDirty()||isCoverageDirty()||isClaimsDirty()||isDisplayDirty()||agreementEditorDirty()||faqEditorDirty()){e.preventDefault();e.returnValue=''}});
  renderAll();
})();
</script>
</body>
